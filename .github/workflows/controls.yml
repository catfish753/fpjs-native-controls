name: Firefox 152 native controls
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Download Firefox 152.0.4
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://archive.mozilla.org/pub/firefox/releases/152.0.4/win64/en-US/Firefox%20Setup%20152.0.4.exe' -OutFile firefox.exe
          7z x firefox.exe -onative-firefox -y | Out-Null
      - name: Collect without WebDriver or remote debugging
        shell: pwsh
        run: |
          $env:FIREFOX_BROWSER = (Resolve-Path 'native-firefox/core/firefox.exe')
          $env:OUTPUT = (Join-Path $pwd 'results/windows-firefox-152.json')
          $env:SCREENSHOT = (Join-Path $pwd 'results/windows-firefox-152.png')
          $env:FIREFOX_PREFS_JSON = '{"privacy.baselineFingerprintingProtection":false,"privacy.fingerprintingProtection":false}'
          $env:FPJS_PRO_AGENT_URL = 'https://demo.fingerprint.com/DBqbMN7zXxwl4Ei8/web/v4/ahNo3Idb3RiQg69bQglE?ci=jsl/4.0.0'
          New-Item -ItemType Directory -Force results | Out-Null
          node scripts/run-native-control.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-firefox-152-control
          path: results/

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Download Firefox 152.0.4
        run: |
          curl -fsSL 'https://archive.mozilla.org/pub/firefox/releases/152.0.4/mac/en-US/Firefox%20152.0.4.dmg' -o firefox.dmg
          mkdir mount
          hdiutil attach firefox.dmg -nobrowse -mountpoint "$PWD/mount"
          cp -R mount/Firefox.app native-firefox.app
          hdiutil detach "$PWD/mount"
      - name: Collect without WebDriver or remote debugging
        run: |
          mkdir -p results
          FIREFOX_BROWSER="$PWD/native-firefox.app/Contents/MacOS/firefox" \
          OUTPUT="$PWD/results/macos-firefox-152.json" \
          SCREENSHOT="$PWD/results/macos-firefox-152.png" \
          FIREFOX_PREFS_JSON='{"privacy.baselineFingerprintingProtection":false,"privacy.fingerprintingProtection":false}' \
          FPJS_PRO_AGENT_URL='https://demo.fingerprint.com/DBqbMN7zXxwl4Ei8/web/v4/ahNo3Idb3RiQg69bQglE?ci=jsl/4.0.0' \
          node scripts/run-native-control.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: macos-firefox-152-control
          path: results/
